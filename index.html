<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>رِواق</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
    }

    body {
        font-family: 'Cairo', sans-serif;

        background:
            radial-gradient(
                circle at top left,
                rgba(255, 249, 242, 0.60),
                transparent 30%
            ),
            radial-gradient(
                circle at bottom right,
                rgba(212, 80, 96, 0.10),
                transparent 30%
            ),
            #FFF9F2;

        color: #5E244E;
        overflow: hidden;
    }

    button {
        font-family: 'Cairo', sans-serif;
        touch-action: manipulation;
    }

    .app {
        width: 100%;
        height: 100vh;
        height: 100dvh;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }

    /* HEADER */

    .header {
        height: 80px;
        min-height: 80px;

        padding: 10px 28px;

        display: flex;
        align-items: center;
        justify-content: flex-end;

        gap: 16px;
    }

    .title-area {
        text-align: right;
        flex: 0 0 auto;
    }

    .logo-area {
        width: 64px;
        height: 64px;

        flex-shrink: 0;

        border-radius: 50%;
        overflow: hidden;

        background: #F3E6D5;

        border: 3px solid #F3E6D5;

        box-shadow:
            0 5px 18px rgba(94, 36, 78, 0.15);
    }

    .logo-area img {
        width: 100%;
        height: 100%;

        object-fit: contain;
        display: block;
    }

    .title-area h1 {
        margin: 0;

        font-size: clamp(22px, 3vw, 36px);
        font-weight: 900;
        line-height: 1.1;

        color: #5E244E;
    }

    .title-area p {
        margin: 5px 0 0;

        font-size: clamp(11px, 1.3vw, 15px);

        color: #5E244E;

        font-weight: 600;
    }

    /* QUESTION */

    .question-section {
        width: min(1100px, 94%);

        margin: 0 auto;

        padding: 8px 20px 12px;

        text-align: center;

        flex-shrink: 0;
    }

    .question-label {
        font-size: 13px;

        color: #5E244E;

        font-weight: 700;

        margin-bottom: 3px;
    }

    #question-text {
        margin: 0;

        font-size: clamp(18px, 2vw, 28px);

        font-weight: 800;

        line-height: 1.35;

        min-height: 42px;

        color: #5E244E;
    }

    #answer-box {
        display: none;

        margin-top: 5px;

        font-size: clamp(13px, 1.3vw, 17px);

        color: #5E244E;

        font-weight: 700;
    }

    #btn-reveal {
        display: none;

        margin-top: 5px;

        border: none;

        background: transparent;

        color: #5E244E;

        font-weight: 700;

        cursor: pointer;
    }

    /* ELEMENT */

    .element-section {
        display: flex;

        align-items: center;
        justify-content: center;

        padding: 4px 20px 10px;

        flex-shrink: 0;
    }

    .element-card {
        width: min(390px, 90%);

        min-height: 92px;

        padding: 12px 24px;

        border-radius: 20px;

        background: #FFE8B4;

        border: 1px solid rgba(94, 36, 78, 0.12);

        box-shadow:
            0 10px 30px rgba(94, 36, 78, 0.10),
            inset 0 1px 0 rgba(255, 249, 242, 0.9);

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 15px;
    }

    .element-icon {
        width: 52px;
        height: 52px;

        min-width: 52px;

        border-radius: 15px;

        background: #F3E6D5;

        color: #5E244E;

        display: flex;

        align-items: center;
        justify-content: center;

        font-size: 25px;
    }

    .custom-element-icon {
        width: 38px;
        height: 38px;

        object-fit: contain;
    }

    #element-name {
        font-size: clamp(21px, 2.2vw, 30px);

        font-weight: 900;

        color: #5E244E;
    }

    /* GAME */

    .game-area {
        flex: 1;

        min-height: 0;

        width: min(1180px, 96%);

        margin: 0 auto;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 20px;

        padding: 4px 0 10px;
    }

    /* TEAM */

    .team-panel {
        min-width: 0;

        min-height: 0;

        background: #F3E6D5;

        border: 1px solid rgba(94, 36, 78, 0.12);

        border-radius: 20px;

        padding: 10px;

        display: flex;

        flex-direction: column;

        box-shadow:
            0 10px 30px rgba(94, 36, 78, 0.08);
    }

    .team-header {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 10px;

        padding: 2px 8px 8px;

        flex-shrink: 0;
    }

    .team-name {
        width: 100%;

        min-width: 0;

        background: transparent;

        border: none;

        outline: none;

        color: #5E244E;

        font-family: 'Cairo', sans-serif;

        font-size: clamp(16px, 1.7vw, 22px);

        font-weight: 800;

        text-align: center;
    }

    .team-score {
        background: #FFE8B4;

        color: #5E244E;

        border-radius: 10px;

        padding: 3px 10px;

        font-weight: 900;

        font-size: 14px;

        white-space: nowrap;
    }

    /* BINGO */

    .bingo-board {
        flex: 1;

        min-height: 0;

        display: grid;

        grid-template-columns: repeat(5, 1fr);

        grid-template-rows: repeat(5, 1fr);

        gap: 6px;
    }

    .bingo-cell {
        min-width: 0;

        min-height: 0;

        border-radius: 10px;

        border: 1px solid rgba(94, 36, 78, 0.12);

        background: #FFF9F2;

        color: #5E244E;

        display: flex;

        flex-direction: column;

        align-items: center;
        justify-content: center;

        text-align: center;

        cursor: pointer;

        transition:
            transform 0.15s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .bingo-cell:hover {
        transform: scale(1.025);

        background: #FFDCDC;
    }

    .bingo-cell i {
        font-size: clamp(14px, 1.5vw, 21px);

        margin-bottom: 2px;

        color: #5E244E;
    }

    .bingo-cell .custom-icon {
        width: clamp(20px, 2.2vw, 32px);
        height: clamp(20px, 2.2vw, 32px);

        margin-bottom: 3px;

        object-fit: contain;
    }

    .free-star {
        font-size: clamp(14px, 1.5vw, 21px);

        margin-bottom: 2px;
    }

    .bingo-cell span {
        font-size: clamp(9px, 1vw, 13px);

        font-weight: 700;

        line-height: 1.1;

        padding: 0 3px;
    }

    .bingo-cell.checked {
        background: #D45060;

        color: #FFF9F2;

        box-shadow:
            0 0 0 2px rgba(212, 80, 96, 0.25),
            0 5px 15px rgba(94, 36, 78, 0.12);
    }

    .bingo-cell.checked i {
        color: #FFF9F2;
    }

    .bingo-cell.free {
        background: #D45060;

        color: #FFF9F2;

        cursor: default;
    }

    .bingo-cell.free i {
        color: #FFF9F2;
    }

    /* CONTROLS */

    .controls {
        width: min(850px, 94%);

        min-height: 68px;

        margin: 0 auto;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 14px;

        padding: 8px 0 14px;

        flex-shrink: 0;

        position: relative;

        z-index: 30;
    }

    .control-btn {
        flex: 1;

        max-width: 330px;

        min-height: 46px;

        border: none;

        border-radius: 13px;

        font-size: clamp(13px, 1.3vw, 17px);

        font-weight: 800;

        cursor: pointer;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 8px;

        transition:
            transform 0.15s ease,
            opacity 0.15s ease;
    }

    .control-btn:hover:not(:disabled) {
        transform: translateY(-2px);
    }

    .control-btn:active:not(:disabled) {
        transform: scale(0.98);
    }

    .element-btn {
        background: #800020;

        color: #FFF9F2;
    }

    .question-btn {
        background: #FFE8B4;

        color: #5E244E;

        border: 1px solid rgba(94, 36, 78, 0.14);
    }

    .control-btn:disabled {
        opacity: 0.45;

        cursor: not-allowed;
    }

    /* WIN */

    #win-modal {
        position: fixed;

        inset: 0;

        display: none;

        align-items: center;
        justify-content: center;

        background: rgba(94, 36, 78, 0.58);

        backdrop-filter: blur(8px);

        z-index: 200;
    }

    #win-modal.show {
        display: flex;
    }

    .win-box {
        width: min(470px, 90%);

        padding: 30px 25px;

        text-align: center;

        border-radius: 25px;

        background:
            linear-gradient(
                145deg,
                #D45060,
                #FFE8B4
            );

        border: 2px solid #FFE8B4;

        box-shadow:
            0 20px 60px rgba(94, 36, 78, 0.25);

        animation: winPop 0.45s ease;
    }

    @keyframes winPop {

        from {
            transform: scale(0.7);

            opacity: 0;
        }

        to {
            transform: scale(1);

            opacity: 1;
        }

    }

    .trophy {
        width: 80px;
        height: 80px;

        margin: 0 auto 15px;

        border-radius: 50%;

        background: #FFE8B4;

        color: #800020;

        display: flex;

        align-items: center;
        justify-content: center;

        font-size: 38px;

        animation:
            trophyBounce 0.9s infinite alternate;
    }

    @keyframes trophyBounce {

        from {
            transform:
                translateY(0)
                rotate(-4deg);
        }

        to {
            transform:
                translateY(-7px)
                rotate(4deg);
        }

    }

    #win-title {
        font-size: 30px;

        font-weight: 900;

        margin: 0 0 8px;

        color: #5E244E;
    }

    #win-message {
        font-size: 15px;

        color: #FFF9F2;

        margin: 0 0 22px;
    }

    .win-buttons {
        display: flex;

        gap: 10px;

        justify-content: center;
    }

    .win-btn {
        border: none;

        border-radius: 12px;

        padding: 11px 18px;

        font-family: 'Cairo', sans-serif;

        font-weight: 800;

        cursor: pointer;
    }

    .reset-btn {
        background: #FFF9F2;

        color: #5E244E;
    }

    .continue-btn {
        background: rgba(255, 249, 242, 0.16);

        color: #FFF9F2;

        border: 1px solid rgba(255, 249, 242, 0.28);
    }

    /* CONFETTI */

    #confetti-container {
        position: fixed;

        inset: 0;

        overflow: hidden;

        pointer-events: none;

        z-index: 300;
    }

    .confetti {
        position: absolute;

        top: -20px;

        width: 9px;
        height: 15px;

        border-radius: 2px;

        animation:
            confettiFall linear forwards;
    }

    @keyframes confettiFall {

        0% {
            transform:
                translate3d(0, -20px, 0)
                rotate(0deg);

            opacity: 1;
        }

        100% {
            transform:
                translate3d(var(--move-x), 110vh, 0)
                rotate(720deg);

            opacity: 0;
        }

    }

    /* SMALL SCREEN */

    @media (max-height: 720px) {

        .header {
            height: 65px;

            min-height: 65px;

            padding: 7px 20px;
        }

        .logo-area {
            width: 50px;
            height: 50px;
        }

        .question-section {
            padding-top: 3px;

            padding-bottom: 5px;
        }

        .element-card {
            min-height: 72px;

            padding: 7px 18px;
        }

        .element-icon {
            width: 42px;
            height: 42px;

            min-width: 42px;

            font-size: 20px;
        }

        .game-area {
            gap: 12px;

            padding-bottom: 5px;
        }

        .team-panel {
            padding: 7px;
        }

        .bingo-board {
            gap: 4px;
        }

        .controls {
            min-height: 57px;

            padding-bottom: 8px;
        }

        .control-btn {
            min-height: 39px;
        }

    }

    @media (max-width: 700px) {

        body {
            overflow: auto;
        }

        .app {
            min-height: 100vh;

            height: auto;

            overflow: visible;
        }

        .header {
            padding: 10px 15px;
        }

        .game-area {
            width: 96%;

            grid-template-columns: 1fr;
        }

        .team-panel {
            min-height: 340px;
        }

        .controls {
            padding-bottom: 15px;
        }

    }

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <!-- GAME -->

        <section class="team-panel">

        </section>

    </main>


    <!-- CONTROLS -->

    <section class="controls">

        <button

            class="control-btn element-btn"
        >

            <i class="fa-solid fa-shuffle"></i>

            سحب عنصر

        </button>


        <button
            id="btn-draw-question"
            type="button"
            class="control-btn question-btn"
        >

            <i class="fa-solid fa-circle-question"></i>

            سحب سؤال

        </button>

    </section>

</div>


<!-- WIN MODAL -->

<div id="win-modal">

    <div id="confetti-container"></div>

    <div class="win-box">

        <div class="trophy">

            <i class="fa-solid fa-trophy"></i>

        </div>

        <h2 id="win-title">
            🎉 مبروك الفوز! 🎉
        </h2>

        <p id="win-message">
            استطاع الفريق إكمال خط مستقيم في لوحة البينجو!
        </p>

        <div class="win-buttons">

            <button
                id="btn-reset-game"
                type="button"
                class="win-btn reset-btn"
            >

                <i class="fa-solid fa-rotate-right"></i>

                إعادة اللعبة

            </button>

        </div>

    </div>

</div>

    /* =====================================================
       SHUFFLE
    ===================================================== */

    function shuffle(array) {

        const arr = [...array];

        for (
            let i = arr.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() * (i + 1)
                );

            [
                arr[i],
                arr[j]
            ] =
            [
                arr[j],
                arr[i]
            ];

        }

        return arr;
    }

       RENDER BOARDS
    ===================================================== */

    function renderTeamBoards() {

        renderBoard(
            'team1-board',
            gameState.team1Checked,
            1
        );

        renderBoard(
            'team2-board',
            gameState.team2Checked,
            2
        );

        updateScores();

    }


    function renderBoard(
        boardId,
        checkedState,
        teamNum
    ) {

        const board =
            document.getElementById(boardId);

        board.innerHTML = '';


        boardElements.forEach(element => {

            const cell =
                document.createElement('button');

            cell.type = 'button';

            cell.className =
                'bingo-cell';


            if (
                checkedState[element.id]
            ) {

                cell.classList.add(
                    'checked'
                );

            }


            if (element.isFree) {

                cell.classList.add(
                    'free'
                );

            }


            cell.innerHTML = element.isFree
                ? `
                    <span class="free-star">⭐</span>
                    <span>${element.name}</span>
                  `
                : `
                    <img
                        src="${element.icon}"
                        alt="${element.name}"
                        class="custom-icon"
                    >
                    <span>${element.name}</span>
                  `;


            if (!element.isFree) {

                cell.addEventListener(
                    'click',
                    () =>
                        toggleTeamCell(
                            teamNum,
                            element.id
                        )
                );

            }


            board.appendChild(cell);

        });

    }


    /* =====================================================
       TOGGLE
    ===================================================== */

    function toggleTeamCell(
        teamNum,
        elementId
    ) {

        const checked =
            teamNum === 1
                ? gameState.team1Checked
                : gameState.team2Checked;


        checked[elementId] =
            !checked[elementId];


        renderTeamBoards();

        checkWinConditions();

    }


    /* =====================================================
       SCORE
    ===================================================== */

    function calculateScore(
        checkedState
    ) {

        return Object.keys(
            checkedState
        )
        .filter(
            id => checkedState[id]
        )
        .length - 1;

    }


    function updateScores() {

        document.getElementById(
            'team1-score'
        ).textContent =
            calculateScore(
                gameState.team1Checked
            );


        document.getElementById(
            'team2-score'
        ).textContent =
            calculateScore(
                gameState.team2Checked
            );

    }


    /* =====================================================
       WIN CONDITIONS
    ===================================================== */

    function checkWinConditions() {

        checkTeamWin(
            1,
            gameState.team1Checked,
            gameState.team1Name
        );


        checkTeamWin(
            2,
            gameState.team2Checked,
            gameState.team2Name
        );

    }


    function checkTeamWin(
        teamNum,
        checkedState,
        teamName
    ) {

        const matrix = [];


        for (
            let row = 0;
            row < 5;
            row++
        ) {

            const currentRow = [];


            for (
                let col = 0;
                col < 5;
                col++
            ) {

                const index =
                    row * 5 + col;


                const element =
                    boardElements[index];


                currentRow.push(
                    !!checkedState[
                        element.id
                    ]
                );

            }


            matrix.push(
                currentRow
            );

        }


        let won = false;


        /* ROWS */

        for (
            let row = 0;
            row < 5;
            row++
        ) {

            if (
                matrix[row].every(Boolean)
            ) {

                won = true;

            }

        }


        /* COLUMNS */

        for (
            let col = 0;
            col < 5;
            col++
        ) {

            let complete = true;


            for (
                let row = 0;
                row < 5;
                row++
            ) {

                if (
                    !matrix[row][col]
                ) {

                    complete = false;

                    break;

                }

            }


            if (complete) {

                won = true;

            }

        }


        /* DIAGONAL 1 */

        if (
            matrix[0][0] &&
            matrix[1][1] &&
            matrix[2][2] &&
            matrix[3][3] &&
            matrix[4][4]
        ) {

            won = true;

        }


        /* DIAGONAL 2 */

        if (
            matrix[0][4] &&
            matrix[1][3] &&
            matrix[2][2] &&
            matrix[3][1] &&
            matrix[4][0]
        ) {

            won = true;

        }


        if (won) {

            if (
                teamNum === 1 &&
                !gameState.hasTeam1Won
            ) {

                gameState.hasTeam1Won = true;

                showWinModal(
                    teamName
                );

            }


            if (
                teamNum === 2 &&
                !gameState.hasTeam2Won
            ) {

                gameState.hasTeam2Won = true;

                showWinModal(
                    teamName
                );

            }

        }

    }


    /* =====================================================
       DRAW ELEMENT
    ===================================================== */

    function drawNextElement() {

        const available =
            RAW_BINGO_ELEMENTS.filter(
                element =>
                    !gameState.drawnElements.some(
                        drawn =>
                            drawn.id === element.id
                    )
            );


        if (!available.length) {

            document.getElementById(
                'btn-draw-element'
            ).disabled = true;


            document.getElementById(
                'element-name'
            ).textContent =
                'انتهت العناصر';


            return;

        }


        const element =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];


        gameState.drawnElements.push(
            element
        );


        gameState.currentElement =
            element;


        document.getElementById(
            'element-name'
        ).textContent =
            element.name;


        document.getElementById(
            'element-icon'
        ).src =
            element.icon;

    }


    /* =====================================================
       DRAW QUESTION
    ===================================================== */

    function drawNextQuestion() {

        const available =
            QUESTIONS.filter(
                question =>
                    !gameState.drawnQuestions.includes(
                        question
                    )
            );


        if (!available.length) {

            document.getElementById(
                'btn-draw-question'
            ).disabled = true;


            document.getElementById(
                'question-text'
            ).textContent =
                'انتهت جميع الأسئلة';


            return;

        }


        const question =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];


        gameState.drawnQuestions.push(
            question
        );


        gameState.currentQuestion =
            question;


        document.getElementById(
            'question-text'
        ).textContent =
            question.q;


        document.getElementById(
            'answer-text'
        ).textContent =
            question.a;


        document.getElementById(
            'answer-box'
        ).style.display =
            'none';


        document.getElementById(
            'btn-reveal'
        ).style.display =
            'inline-block';

    }


    /* =====================================================
       REVEAL ANSWER
    ===================================================== */

    function revealAnswer() {

        if (
            !gameState.currentQuestion
        ) {

            return;

        }


        document.getElementById(
            'answer-box'
        ).style.display =
            'block';


        document.getElementById(
            'btn-reveal'
        ).style.display =
            'none';

    }


    /* =====================================================
       WIN MODAL
    ===================================================== */

    function showWinModal(
        teamName
    ) {

        document.getElementById(
            'win-title'
        ).textContent =
            `🎉 مبروك الفوز يا ${teamName}! 🎉`;


        document.getElementById(
            'win-message'
        ).textContent =
            'استطاع الفريق إكمال خط مستقيم في لوحة البينجو!';


        document.getElementById(
            'win-modal'
        ).classList.add(
            'show'
        );


        startCelebration();

    }


    /* =====================================================
       CLOSE MODAL
    ===================================================== */

    function closeWinModal() {

        document.getElementById(
            'win-modal'
        ).classList.remove(
            'show'
        );


        clearCelebration();

    }


    /* =====================================================
       RESET GAME
    ===================================================== */

    function resetGame() {

        gameState.drawnElements = [];

        gameState.drawnQuestions = [];

        gameState.currentElement = null;

        gameState.currentQuestion = null;


        gameState.team1Checked = {
            free: true
        };


        gameState.team2Checked = {
            free: true
        };


        gameState.hasTeam1Won = false;

        gameState.hasTeam2Won = false;


        document.getElementById(
            'question-text'
        ).textContent =
            'اضغط على "سحب سؤال" لبدء اللعبة';


        document.getElementById(
            'answer-text'
        ).textContent = '';


        document.getElementById(
            'answer-box'
        ).style.display =
            'none';


        document.getElementById(
            'btn-reveal'
        ).style.display =
            'none';


        document.getElementById(
            'element-name'
        ).textContent =
            'اسحب عنصرًا';


        document.getElementById(
            'element-icon'
        ).src =
            'Dallah.svg';


        document.getElementById(
            'btn-draw-element'
        ).disabled = false;


        document.getElementById(
            'btn-draw-question'
        ).disabled = false;


        closeWinModal();

        renderTeamBoards();

    }


    /* =====================================================
       CONFETTI
    ===================================================== */

    function startCelebration() {

        const container =
            document.getElementById(
                'confetti-container'
            );


        container.innerHTML = '';


        const pieces = 90;


        const confettiColors = [

            '#D45060',

            '#F3E6D5',

            '#FFE8B4',

            '#800020',

            '#8EA66B'

        ];


        for (
            let i = 0;
            i < pieces;
            i++
        ) {

            const piece =
                document.createElement(
                    'div'
                );


            piece.className =
                'confetti';


            piece.style.left =
                Math.random() * 100 + '%';


            piece.style.background =
                confettiColors[
                    Math.floor(
                        Math.random() *
                        confettiColors.length
                    )
                ];


            piece.style.setProperty(
                '--move-x',
                ((Math.random() - 0.5) * 400) + 'px'
            );


            piece.style.animationDuration =
                (2.5 + Math.random() * 2.5) + 's';


            piece.style.animationDelay =
                (Math.random() * 0.8) + 's';


            container.appendChild(
                piece
            );

        }

    }


    /* =====================================================
       CLEAR CONFETTI
    ===================================================== */

    function clearCelebration() {

        const container =
            document.getElementById(
                'confetti-container'
            );


        container.innerHTML = '';

    }


    /* =====================================================
       TEAM NAMES
    ===================================================== */

    document.getElementById(
        'team1-name'
    ).addEventListener(
        'input',
        function () {

            gameState.team1Name =
                this.value.trim() ||
                'فريق الوسم';

        }
    );


    document.getElementById(
        'team2-name'
    ).addEventListener(
        'input',
        function () {

            gameState.team2Name =
                this.value.trim() ||
                'فريق الغيم';

        }
    );


    /* =====================================================
       BUTTON EVENTS
    ===================================================== */

    document.getElementById(
        'btn-draw-element'
    ).addEventListener(
        'click',
        drawNextElement
    );


    document.getElementById(
        'btn-draw-question'
    ).addEventListener(
        'click',
        drawNextQuestion
    );


    document.getElementById(
        'btn-reveal'
    ).addEventListener(
        'click',
        revealAnswer
    );


    document.getElementById(
        'btn-reset-game'
    ).addEventListener(
        'click',
        resetGame
    );


    /* =====================================================
       START
    ===================================================== */

    renderTeamBoards();

</script>

</body>
</html>
